<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="940" height="440" role="img" aria-label="Containers: a browser and Vercel Cron call the SvelteKit app on Vercel; the app reads and writes Neon Postgres and calls the GitHub API; GitHub posts webhooks to the app; Node scripts run migrations and syncs against the same database and GitHub.">
  <title>Containers: a browser and Vercel Cron call the SvelteKit app on Vercel; the app reads and writes Neon Postgres and calls the GitHub API; GitHub posts webhooks to the app; Node scripts run migrations and syncs against the same database and GitHub.</title>
  <style>
    svg { --bg: #ffffff; --fg: #172026; --muted: #56646e; --line: #b9c4cb; --surface: #ffffff;
      --accent: #0f6a78; --accent-soft: #dcf0f2; --ext: #eceff1; --person: #f3e6d4; --person-line: #9a6a2c;
      color: var(--muted); }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #0d1117; --fg: #e3eaee; --muted: #93a3ad; --line: #3b4a53; --surface: #182127;
        --accent: #5cc3d2; --accent-soft: #143a41; --ext: #1d262c; --person: #3a2d1c; --person-line: #d8a764; }
    }
    .bg { fill: var(--bg); }
    .n-person { fill: var(--person); stroke: var(--person-line); stroke-width: 1.5; }
    .n-sys { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.8; }
    .n-box { fill: var(--surface); stroke: var(--fg); stroke-width: 1.2; }
    .n-ext { fill: var(--ext); stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .n-core { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.2; stroke-dasharray: 2 3; }
    .bound { fill: none; stroke: var(--accent); stroke-width: 1.2; stroke-dasharray: 7 5; }
    .t { fill: var(--fg); font: 700 13.5px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .d { fill: var(--fg); font: 400 11.5px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .l { fill: var(--muted); font: 400 11.5px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .k { fill: var(--muted); font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .bl { fill: var(--accent); font: 600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .04em; }
    .a { stroke: currentColor; stroke-width: 1.3; fill: none; }
    .a-hot { stroke: var(--accent); stroke-width: 1.6; fill: none; }
  </style>
  <rect class="bg" width="940" height="440" rx="8"/>
          <defs>
            <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
          </defs>
          <rect class="bound" x="200" y="16" width="440" height="408" rx="8"/>
          <text class="bl" x="216" y="36">PROJECT MAGIC · YOUR ACCOUNTS</text>

          <!-- browser -->
          <rect class="n-person" x="10" y="60" width="160" height="64" rx="10"/>
          <text class="t" x="90" y="86" text-anchor="middle">Web browser</text>
          <text class="d" x="90" y="105" text-anchor="middle">you, signed in</text>
          <!-- cron -->
          <rect class="n-ext" x="10" y="150" width="160" height="56" rx="6"/>
          <text class="t" x="90" y="174" text-anchor="middle">Vercel Cron</text>
          <text class="k" x="90" y="192" text-anchor="middle">vercel.json</text>

          <!-- app -->
          <rect class="n-sys" x="280" y="56" width="340" height="150" rx="6"/>
          <text class="t" x="450" y="84" text-anchor="middle">Web app</text>
          <text class="k" x="450" y="102" text-anchor="middle">[SvelteKit · Svelte 5 · Vercel functions]</text>
          <text class="d" x="450" y="128" text-anchor="middle">pages: overview, list, board, plan,</text>
          <text class="d" x="450" y="144" text-anchor="middle">done, branches, docs, search</text>
          <text class="d" x="450" y="166" text-anchor="middle">endpoints: webhook, cron, OAuth, sync</text>
          <text class="d" x="450" y="182" text-anchor="middle">derived state cached in memory</text>

          <!-- postgres -->
          <rect class="n-box" x="280" y="300" width="160" height="100" rx="6"/>
          <text class="t" x="360" y="326" text-anchor="middle">Database</text>
          <text class="k" x="360" y="343" text-anchor="middle">[Neon Postgres]</text>
          <text class="d" x="360" y="364" text-anchor="middle">refs, blob parses,</text>
          <text class="d" x="360" y="380" text-anchor="middle">users, edit_log</text>

          <!-- scripts -->
          <rect class="n-box" x="480" y="300" width="140" height="100" rx="6"/>
          <text class="t" x="550" y="326" text-anchor="middle">CLI scripts</text>
          <text class="k" x="550" y="343" text-anchor="middle">[Node 24]</text>
          <text class="d" x="550" y="364" text-anchor="middle">make migrate</text>
          <text class="d" x="550" y="380" text-anchor="middle">make sync</text>

          <!-- github -->
          <rect class="n-ext" x="760" y="56" width="160" height="150" rx="6"/>
          <text class="t" x="840" y="90" text-anchor="middle">GitHub</text>
          <text class="k" x="840" y="108" text-anchor="middle">[GraphQL + REST]</text>
          <text class="d" x="840" y="134" text-anchor="middle">GitHub App,</text>
          <text class="d" x="840" y="150" text-anchor="middle">installed per repo</text>

          <line class="a" x1="170" y1="92" x2="278" y2="92" marker-end="url(#ar2)"/>
          <text class="l" x="240" y="84" text-anchor="middle">HTTPS</text>
          <line class="a" x1="170" y1="178" x2="278" y2="178" marker-end="url(#ar2)"/>
          <text class="l" x="240" y="170" text-anchor="middle">secret</text>

          <line class="a" x1="620" y1="88" x2="758" y2="88" marker-end="url(#ar2)"/>
          <text class="l" x="700" y="81" text-anchor="middle">reads, app token</text>
          <line class="a-hot" x1="620" y1="130" x2="758" y2="130" marker-end="url(#ar2)"/>
          <text class="l" x="700" y="123" text-anchor="middle">commit · PR · merge</text>
          <line class="a" x1="758" y1="172" x2="622" y2="172" marker-end="url(#ar2)"/>
          <text class="l" x="700" y="165" text-anchor="middle">webhook, HMAC</text>

          <line class="a" x1="360" y1="206" x2="360" y2="298" marker-end="url(#ar2)"/>
          <text class="l" x="370" y="256">SQL (pooled)</text>

          <line class="a" x1="480" y1="350" x2="442" y2="350" marker-end="url(#ar2)"/>
          <polyline class="a" points="620,330 840,330 840,208" marker-end="url(#ar2)"/>
          <text class="l" x="850" y="272">sync</text>
        </svg>
