<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680" role="img" aria-label="Components: every request passes hooks.server; pages load project-state, which reads the database and assembles state with the core; sync endpoints go through sync-runner to sync.ts, which calls GitHub GraphQL and writes the database; edit actions go through edits.ts, write.ts and user-token.ts to GitHub REST, then ask sync-runner to sync.">
  <title>Components: every request passes hooks.server; pages load project-state, which reads the database and assembles state with the core; sync endpoints go through sync-runner to sync.ts, which calls GitHub GraphQL and writes the database; edit actions go through edits.ts, write.ts and user-token.ts to GitHub REST, then ask sync-runner to sync.</title>
  <style>
    svg { --bg: #ffffff; --fg: #172026; --muted: #56646e; --line: #b9c4cb; --surface: #ffffff;
      --accent: #0f6a78; --accent-soft: #dcf0f2; --ext: #eceff1; --person: #f3e6d4; --person-line: #9a6a2c;
      color: var(--muted); }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #0d1117; --fg: #e3eaee; --muted: #93a3ad; --line: #3b4a53; --surface: #182127;
        --accent: #5cc3d2; --accent-soft: #143a41; --ext: #1d262c; --person: #3a2d1c; --person-line: #d8a764; }
    }
    .bg { fill: var(--bg); }
    .n-person { fill: var(--person); stroke: var(--person-line); stroke-width: 1.5; }
    .n-sys { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.8; }
    .n-box { fill: var(--surface); stroke: var(--fg); stroke-width: 1.2; }
    .n-ext { fill: var(--ext); stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .n-core { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.2; stroke-dasharray: 2 3; }
    .bound { fill: none; stroke: var(--accent); stroke-width: 1.2; stroke-dasharray: 7 5; }
    .t { fill: var(--fg); font: 700 13.5px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .d { fill: var(--fg); font: 400 11.5px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .l { fill: var(--muted); font: 400 11.5px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .k { fill: var(--muted); font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .bl { fill: var(--accent); font: 600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .04em; }
    .a { stroke: currentColor; stroke-width: 1.3; fill: none; }
    .a-hot { stroke: var(--accent); stroke-width: 1.6; fill: none; }
  </style>
  <rect class="bg" width="960" height="680" rx="8"/>
          <defs>
            <marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
          </defs>
          <!-- column headings -->
          <text class="bl" x="40" y="100">READ</text>
          <text class="bl" x="350" y="100">SYNC</text>
          <text class="bl" x="660" y="100">WRITE</text>

          <!-- gate -->
          <rect class="n-sys" x="40" y="16" width="880" height="58" rx="6"/>
          <text class="t" x="480" y="40" text-anchor="middle">hooks.server.ts · every request</text>
          <text class="d" x="480" y="60" text-anchor="middle">signed cookie → user re-read → route looked up in routes.ts → access.can()  ·  unlisted route = refused</text>

          <!-- row 1 -->
          <rect class="n-box" x="40" y="110" width="260" height="64" rx="6"/>
          <text class="t" x="170" y="136" text-anchor="middle">Pages + loads</text>
          <text class="k" x="170" y="156" text-anchor="middle">routes/, p/[repo]/*, search</text>
          <rect class="n-box" x="350" y="110" width="260" height="64" rx="6"/>
          <text class="t" x="480" y="136" text-anchor="middle">Sync triggers</text>
          <text class="k" x="480" y="156" text-anchor="middle">webhook · cron · Refresh</text>
          <rect class="n-box" x="660" y="110" width="260" height="64" rx="6"/>
          <text class="t" x="790" y="136" text-anchor="middle">Edit actions</text>
          <text class="k" x="790" y="156" text-anchor="middle">i/[id]/edit · new · edits/merge</text>

          <!-- row 2 -->
          <rect class="n-box" x="40" y="220" width="260" height="64" rx="6"/>
          <text class="t" x="170" y="246" text-anchor="middle">project-state.ts</text>
          <text class="d" x="170" y="266" text-anchor="middle">state held per instance until next sync</text>
          <rect class="n-box" x="350" y="220" width="260" height="64" rx="6"/>
          <text class="t" x="480" y="246" text-anchor="middle">sync-runner.ts</text>
          <text class="d" x="480" y="266" text-anchor="middle">one sync per project; bursts coalesce</text>
          <rect class="n-box" x="660" y="220" width="260" height="64" rx="6"/>
          <text class="t" x="790" y="246" text-anchor="middle">edits.ts</text>
          <text class="d" x="790" y="266" text-anchor="middle">find backlog, log edit, track pending PR</text>

          <!-- row 3 -->
          <rect class="n-box" x="350" y="330" width="260" height="64" rx="6"/>
          <text class="t" x="480" y="356" text-anchor="middle">sync.ts</text>
          <text class="d" x="480" y="376" text-anchor="middle">2 GraphQL calls; parse new blob oids only</text>
          <rect class="n-box" x="660" y="330" width="260" height="64" rx="6"/>
          <text class="t" x="790" y="356" text-anchor="middle">write.ts</text>
          <text class="d" x="790" y="376" text-anchor="middle">splice → projectmagic branch → squash</text>

          <!-- row 4 -->
          <rect class="n-box" x="660" y="430" width="260" height="56" rx="6"/>
          <text class="t" x="790" y="453" text-anchor="middle">user-token.ts</text>
          <text class="d" x="790" y="472" text-anchor="middle">encrypted refresh → access token</text>

          <!-- row 5 -->
          <rect class="n-box" x="40" y="520" width="260" height="56" rx="6"/>
          <text class="t" x="170" y="543" text-anchor="middle">db.ts</text>
          <text class="k" x="170" y="562" text-anchor="middle">→ Neon Postgres</text>
          <rect class="n-box" x="350" y="520" width="570" height="56" rx="6"/>
          <text class="t" x="635" y="543" text-anchor="middle">github-client.ts + github-app.ts</text>
          <text class="k" x="635" y="562" text-anchor="middle">→ api.github.com · app JWT → installation token for reads</text>

          <!-- core band -->
          <rect class="n-core" x="40" y="606" width="880" height="58" rx="6"/>
          <text class="t" x="480" y="630" text-anchor="middle">lib/core · pure, no I/O, used by every box above</text>
          <text class="k" x="480" y="650" text-anchor="middle">backlog · progress · link · status · state · history · splice · access · config</text>

          <!-- gate arrows -->
          <line class="a" x1="170" y1="74" x2="170" y2="108" marker-end="url(#ar3)"/>
          <line class="a" x1="480" y1="74" x2="480" y2="108" marker-end="url(#ar3)"/>
          <line class="a" x1="790" y1="74" x2="790" y2="108" marker-end="url(#ar3)"/>

          <!-- read path -->
          <line class="a" x1="170" y1="174" x2="170" y2="218" marker-end="url(#ar3)"/>
          <text class="l" x="180" y="200">load</text>
          <line class="a" x1="170" y1="284" x2="170" y2="518" marker-end="url(#ar3)"/>
          <text class="l" x="180" y="400">refs + cached parses,</text>
          <text class="l" x="180" y="416">then assembleState()</text>

          <!-- sync path -->
          <line class="a" x1="480" y1="174" x2="480" y2="218" marker-end="url(#ar3)"/>
          <text class="l" x="490" y="200">request sync</text>
          <line class="a" x1="480" y1="284" x2="480" y2="328" marker-end="url(#ar3)"/>
          <text class="l" x="490" y="310">waitUntil</text>
          <line class="a" x1="480" y1="394" x2="480" y2="518" marker-end="url(#ar3)"/>
          <text class="l" x="490" y="460">GraphQL</text>
          <line class="a" x1="390" y1="394" x2="262" y2="518" marker-end="url(#ar3)"/>
          <text class="l" x="320" y="446" text-anchor="end">upsert</text>

          <!-- write path -->
          <line class="a-hot" x1="790" y1="174" x2="790" y2="218" marker-end="url(#ar3)"/>
          <text class="l" x="800" y="200">Op</text>
          <line class="a-hot" x1="790" y1="284" x2="790" y2="328" marker-end="url(#ar3)"/>
          <text class="l" x="800" y="310">commit</text>
          <line class="a-hot" x1="790" y1="394" x2="790" y2="428" marker-end="url(#ar3)"/>
          <text class="l" x="800" y="416">as user</text>
          <line class="a-hot" x1="790" y1="486" x2="790" y2="518" marker-end="url(#ar3)"/>
          <text class="l" x="800" y="506">REST</text>
          <line class="a" x1="660" y1="252" x2="612" y2="252" marker-end="url(#ar3)"/>
          <text class="l" x="636" y="244" text-anchor="middle">then</text>
        </svg>
