<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 370" width="860" height="370" role="img" aria-label="System context: a person uses Project Magic, which reads from and commits to GitHub; AI agents push to GitHub; GitHub sends webhooks; Vercel Cron triggers a daily sync.">
  <title>System context: a person uses Project Magic, which reads from and commits to GitHub; AI agents push to GitHub; GitHub sends webhooks; Vercel Cron triggers a daily sync.</title>
  <style>
    svg { --bg: #ffffff; --fg: #172026; --muted: #56646e; --line: #b9c4cb; --surface: #ffffff;
      --accent: #0f6a78; --accent-soft: #dcf0f2; --ext: #eceff1; --person: #f3e6d4; --person-line: #9a6a2c;
      color: var(--muted); }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #0d1117; --fg: #e3eaee; --muted: #93a3ad; --line: #3b4a53; --surface: #182127;
        --accent: #5cc3d2; --accent-soft: #143a41; --ext: #1d262c; --person: #3a2d1c; --person-line: #d8a764; }
    }
    .bg { fill: var(--bg); }
    .n-person { fill: var(--person); stroke: var(--person-line); stroke-width: 1.5; }
    .n-sys { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.8; }
    .n-box { fill: var(--surface); stroke: var(--fg); stroke-width: 1.2; }
    .n-ext { fill: var(--ext); stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .n-core { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.2; stroke-dasharray: 2 3; }
    .bound { fill: none; stroke: var(--accent); stroke-width: 1.2; stroke-dasharray: 7 5; }
    .t { fill: var(--fg); font: 700 13.5px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .d { fill: var(--fg); font: 400 11.5px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .l { fill: var(--muted); font: 400 11.5px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .k { fill: var(--muted); font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .bl { fill: var(--accent); font: 600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .04em; }
    .a { stroke: currentColor; stroke-width: 1.3; fill: none; }
    .a-hot { stroke: var(--accent); stroke-width: 1.6; fill: none; }
  </style>
  <rect class="bg" width="860" height="370" rx="8"/>
          <defs>
            <marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
          </defs>
          <!-- person -->
          <rect class="n-person" x="20" y="148" width="180" height="84" rx="10"/>
          <text class="t" x="110" y="180" text-anchor="middle">You and your team</text>
          <text class="k" x="110" y="198" text-anchor="middle">[Person]</text>
          <text class="d" x="110" y="216" text-anchor="middle">signed in with GitHub</text>
          <!-- system -->
          <rect class="n-sys" x="290" y="138" width="220" height="104" rx="6"/>
          <text class="t" x="400" y="170" text-anchor="middle">Project Magic</text>
          <text class="k" x="400" y="188" text-anchor="middle">[Software system]</text>
          <text class="d" x="400" y="208" text-anchor="middle">derives status from backlogs,</text>
          <text class="d" x="400" y="224" text-anchor="middle">plans, branches and PRs</text>
          <!-- agents -->
          <rect class="n-ext" x="650" y="20" width="190" height="72" rx="6"/>
          <text class="t" x="745" y="48" text-anchor="middle">AI coding agents</text>
          <text class="d" x="745" y="68" text-anchor="middle">follow specs/conventions.md</text>
          <!-- github -->
          <rect class="n-ext" x="650" y="138" width="190" height="104" rx="6"/>
          <text class="t" x="745" y="170" text-anchor="middle">GitHub</text>
          <text class="k" x="745" y="188" text-anchor="middle">[External · via GitHub App]</text>
          <text class="d" x="745" y="208" text-anchor="middle">managed repositories:</text>
          <text class="d" x="745" y="224" text-anchor="middle">backlog.md, PROGRESS.md</text>
          <!-- cron -->
          <rect class="n-ext" x="290" y="294" width="220" height="56" rx="6"/>
          <text class="t" x="400" y="318" text-anchor="middle">Vercel Cron</text>
          <text class="d" x="400" y="336" text-anchor="middle">05:00 daily</text>

          <line class="a" x1="200" y1="190" x2="288" y2="190" marker-end="url(#ar1)"/>
          <text class="l" x="244" y="181" text-anchor="middle">views, edits</text>

          <line class="a" x1="510" y1="166" x2="648" y2="166" marker-end="url(#ar1)"/>
          <text class="l" x="579" y="159" text-anchor="middle">reads (GraphQL)</text>
          <line class="a-hot" x1="510" y1="192" x2="648" y2="192" marker-end="url(#ar1)"/>
          <text class="l" x="579" y="185" text-anchor="middle">commits as you</text>
          <line class="a" x1="648" y1="218" x2="512" y2="218" marker-end="url(#ar1)"/>
          <text class="l" x="579" y="211" text-anchor="middle">webhooks</text>

          <line class="a" x1="745" y1="92" x2="745" y2="136" marker-end="url(#ar1)"/>
          <text class="l" x="735" y="119" text-anchor="end">push branches, PRs</text>

          <line class="a" x1="400" y1="294" x2="400" y2="244" marker-end="url(#ar1)"/>
          <text class="l" x="410" y="272">re-sync everything</text>
        </svg>
